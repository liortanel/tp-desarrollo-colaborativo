<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ideas Último Año</title>

</head>

<body>

<header class="navbar">

</header>

<main>

<section class="hero">

<h1>Propuestas para el último año</h1>
<p>Votá ideas para hacer este último año inolvidable.</p>

<button id="votar">Apoyar esta idea</button>

<h2>Enviar una propuesta</h2>

<input type="text" id="nombre" name="nombre">

<label for="idea">Tu propuesta</label>
<input type="text" id="idea" name="idea">

<button type="submit">Enviar propuesta</button>

<p id="mensaje"></p>

</form>

</section>


<section class="ideas">

<h2>Ideas de la promoción</h2>

<ul>
<li>Viaje de egresados</li>
<li>Fiesta temática</li>

<li>Torneo deportivo</li>
</ul>

</section>

</main>

<footer id="contacto">
<p>Promoción 2026</p>
</footer>
